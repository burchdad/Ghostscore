name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest-cov ruff black isort

      - name: Run linters (ruff)
        run: ruff check backend

      - name: Check formatting (black/isort)
        run: |
          black --check backend || true
          isort --check-only backend || true

      - name: Run backend tests
        run: |
          pytest backend --maxfail=1 -q --cov=backend --cov-report=xml --cov-fail-under=80

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml

  frontend:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install and run frontend tests
        working-directory: frontend
        run: |
          npm ci
          npm run test -- --coverage
      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
      - name: Build frontend
        working-directory: frontend
        run: |
          npm run build
          npm run lint || true
