version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ghostscore
      POSTGRES_USER: ghostscore
      POSTGRES_PASSWORD: ghostscore
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://ghostscore:ghostscore@db:5432/ghostscore
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

volumes:
  db_data:
